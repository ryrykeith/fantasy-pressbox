name: Publish

# Publishes to npm when a GitHub release is published. It authenticates with
# npm trusted publishing (OIDC): no npm token is stored anywhere, and npm
# attaches provenance linking the tarball to this workflow run. Until the
# trusted publisher is configured on npmjs.com (see RELEASING.md) the publish
# step fails with an auth error and nothing is published.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the release matches package.json and CHANGELOG.md
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version; tag it v$version."
            exit 1
          fi
          if ! grep -q "^## $version\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check npm supports trusted publishing (11.5.1 or newer)
        run: |
          node -e '
            const v = require("child_process").execSync("npm --version").toString().trim();
            const [a, b, c] = v.split(".").map(Number);
            if (a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)))) process.exit(0);
            console.error(`::error::npm ${v} cannot use trusted publishing; it needs 11.5.1 or newer.`);
            process.exit(1);
          '

      - name: Skip if this version is already on npm
        run: |
          if npm view "fantasy-pressbox@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::fantasy-pressbox@$VERSION is already published; nothing to do."
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      # prepublishOnly runs npm test and scripts/check-pack.mjs first, so a
      # failing test or a forbidden file stops the publish. A pre-release goes
      # out under the "next" dist-tag so `npm install` keeps getting the
      # latest stable version.
      - name: Publish
        if: env.ALREADY_PUBLISHED != '1'
        run: npm publish ${{ github.event.release.prerelease && '--tag next' || '' }}
