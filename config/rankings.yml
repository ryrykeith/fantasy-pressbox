# ============================================================================
# Power ranking settings — how teams are judged.
#
# Power rankings are not standings. They answer "who looks strongest right
# now, accounting for dynasty context", not "who has the best record".
# ============================================================================

# How much each factor counts. These are guidance given to the model, not a
# formula it computes — but they steer it hard, so tune them deliberately.
# Each set below should add up to 1.0 on its own.
#
# One set per resolved league format (see src/format.mjs). A partial set here
# REPLACES the built-in default wholesale rather than merging into it — five
# weights means five, not five plus the four you didn't mention — so if you
# override a set, write out every key it needs.
#
# guillotine has no set of its own yet: its ranking has nothing to do with
# asset quality (survival is about weekly floor), so neither set below is
# right for it. That set is specified alongside the guillotine format's own
# edition work — see Epic: Guillotine league coverage. Until it lands, a
# guillotine RANKING fails loudly instead of silently borrowing the dynasty
# set — see resolveRankingWeights in src/config.mjs. The survival preview is
# unaffected: it judges floors rather than ranking rosters, so it never asks
# for a weight set.
weights:
  dynasty:
    starting_lineup: 0.30        # how good the week-to-week starting ten is
    dynasty_value: 0.25          # what the assets are worth long term
    depth: 0.15                  # survives an injury or a bye
    quarterback: 0.10            # weighted heavily in Superflex leagues
    future_draft_capital: 0.10   # picks for drafts not yet held; spent picks
                                  # are excluded, so a startup draft never
                                  # counts here
    roster_flexibility: 0.05     # can fill holes without gutting itself
    contender_viability: 0.05    # can win *this* season, not just later

  redraft:
    # No dynasty_value, no future_draft_capital: rosters are re-drafted every
    # season, so there is no long-term asset to weigh and no future pick to
    # own. The 0.35 that freed up moves to the three factors that matter more
    # once nothing carries over to next year.
    starting_lineup: 0.45         # +0.15 over the dynasty set
    depth: 0.25                   # +0.10 over the dynasty set
    quarterback: 0.10             # weighted heavily in Superflex leagues
    roster_flexibility: 0.05      # can fill holes without gutting itself
    contender_viability: 0.15     # +0.10 over the dynasty set — this season
                                   # is the only season

weekly:
  # How far a team should normally move in one week. One Sunday is a very
  # small sample and the rankings should act like it.
  max_normal_movement: 3
  # ...but a genuinely extraordinary week is allowed to break that rule.
  allow_exceptional_movement: true

tiers:
  # Group teams into tiers as well as ranking them 1..N. Tier names are
  # written fresh each week by the publication; this only turns them on.
  enabled: true
