# ============================================================================
# Power ranking settings — how teams are judged.
#
# Power rankings are not standings. They answer "who looks strongest right
# now, by the standards of this league's format", not "who has the best
# record". A dynasty league counts long-term assets; a redraft league counts
# only this season.
# ============================================================================

# How much each factor counts. These are guidance given to the model, not a
# formula it computes — but they steer it hard, so tune them deliberately.
# Each set below should add up to 1.0 on its own.
#
# One set per resolved league format (see src/format.mjs). A partial set here
# REPLACES the built-in default wholesale rather than merging into it — five
# weights means five, not five plus the four you didn't mention — so if you
# override a set, write out every key it needs.
#
# Every format the publication understands has a set below. A format without
# one is refused rather than ranked on somebody else's criteria — see
# resolveRankingChoice in src/settings.mjs — so if you delete a set, the league
# it belonged to stops ranking and says why.
#
# These sets are the `balanced` preset (see `presets` further down). A league
# folder's own config/rankings.yml may pick another preset with one line:
#
#   preset: rebuild
#
# or write out its own weights.<format> instead. Not both for the same format:
# a league that names a preset and writes its own set for its format is refused,
# naming both, because nothing should silently win.
weights:
  dynasty:
    starting_lineup: 0.30        # how good the week-to-week starting ten is
    dynasty_value: 0.25          # what the assets are worth long term
    depth: 0.15                  # survives an injury or a bye
    quarterback: 0.10            # weighted heavily in Superflex leagues
    future_draft_capital: 0.10   # picks for drafts not yet held; spent picks
                                  # are excluded, so a startup draft never
                                  # counts here
    roster_flexibility: 0.05     # can fill holes without gutting itself
    contender_viability: 0.05    # can win *this* season, not just later

  redraft:
    # No dynasty_value, no future_draft_capital: rosters are re-drafted every
    # season, so there is no long-term asset to weigh and no future pick to
    # own. The 0.35 that freed up moves to the three factors that matter more
    # once nothing carries over to next year.
    starting_lineup: 0.45         # +0.15 over the dynasty set
    depth: 0.25                   # +0.10 over the dynasty set
    quarterback: 0.10             # weighted heavily in Superflex leagues
    roster_flexibility: 0.05      # can fill holes without gutting itself
    contender_viability: 0.15     # +0.10 over the dynasty set — this season
                                   # is the only season

  guillotine:
    # Used by the `survival-rankings` edition, which is the only ranking a
    # guillotine league has. The format inverts the usual advice: you do not
    # need the most points, only to not be last, so these weights judge the
    # floor a roster falls to rather than the ceiling it reaches.
    #
    # There is no dynasty_value and no future_draft_capital, and not because
    # they are small — because they are nothing. A chopped team's season is
    # over, so a pick for a draft it will not be in is worth zero. There is no
    # contender_viability either: the only way to contend is to still be here.
    weekly_floor: 0.40            # the lowest and median week a roster has
                                   # posted — what actually predicts a chop
    starting_lineup: 0.25         # how good the week-to-week starting ten is
    bye_exposure: 0.15            # a bye cluster is an elimination risk here,
                                   # not a week to shrug off
    faab_remaining: 0.10          # ammunition for the pools later chops
                                   # release, which keep getting better
    depth: 0.10                   # injury survivability — one hole is how a
                                   # floor collapses

  future_stock:
    # Used only by the `future-stock` edition, which is dynasty-only. Not a
    # league format: the key is the edition's name. It ranks who is set up for
    # the next three seasons, so it leans on age and picks and treats this
    # week's form as evidence, not the thing ranked. Picks and youth are upside
    # on top of production, never a substitute for it — hence production and
    # age outweigh capital.
    sustainable_production: 0.25  # points scored by players young enough to
                                   # keep scoring (demonstrated, not projected)
    roster_age_window: 0.25       # where the roster sits on each position's
                                   # age curve; the dynasty set has no age
                                   # factor at all
    future_draft_capital: 0.20    # double the dynasty set's 0.10
    dynasty_value: 0.15           # what the assets are worth long term
    quarterback: 0.10             # weighted heavily in Superflex leagues
    starting_lineup: 0.05         # current form: far less than dynasty's 0.30

# Ranking presets: named alternatives to the sets under `weights`, chosen per
# league with `preset: <name>`. Leaving `preset` out means `balanced`, which is
# the sets under `weights` exactly, so a league that names no preset ranks as
# it always has.
#
#   dynasty     balanced, win-now, rebuild
#   redraft     balanced, win-now
#   guillotine  balanced only
#
# Like the sets above, these are editorial guidance — a statement of what the
# league ranks FOR — not a formula and not a fact about any team. Each set adds
# up to 1.0 and uses the same factors as the balanced set it shifts, so the
# prompt describes every preset in the same words; only the emphasis moves.
# A partial set in a league's own file replaces the shipped one wholesale, as
# under `weights`. A preset also chooses the team strength rating's weights,
# which sit beside each preset's `weights` as strength.<format> (see `strength`
# below for what the components are).
#
# Guillotine has no other preset on purpose: the format already decides what a
# team plays for (not being last this week), so "win-now" and "rebuild" mean
# nothing there. future_stock has none either: it is one edition's set, not a
# league's emphasis.
presets:
  win-now:
    # For a league that ranks who can take this season's title. Weight moves
    # from long-term assets to the roster that plays on Sunday.
    weights:
      dynasty:
        starting_lineup: 0.40      # +0.10: the starting ten is the case
        dynasty_value: 0.10        # -0.15: a contender's assets are spent
                                    # on this year, not banked
        depth: 0.20                # +0.05: one injury in a title run costs
                                    # more than in a lost season
        quarterback: 0.10          # unchanged: Superflex scarcity is the
                                    # same whatever the league ranks for
        future_draft_capital: 0.05 # -0.05: picks are currency to trade for
                                    # help now, not the thing ranked
        roster_flexibility: 0.05   # unchanged
        contender_viability: 0.10  # +0.05: can it actually win it this year
      redraft:
        # Redraft has no long-term assets to move weight away from, so win-now
        # here trades insurance for ceiling: a lineup that wins a title over
        # a deep bench that survives one.
        starting_lineup: 0.50      # +0.05 over balanced
        depth: 0.15                # -0.10 over balanced
        quarterback: 0.10          # unchanged
        roster_flexibility: 0.05   # unchanged
        contender_viability: 0.20  # +0.05 over balanced
    strength:
      dynasty:
        lineup: 0.45               # +0.10: the lineup is the title case
        depth: 0.15                # +0.05: a title run cannot lose a starter
        market_value: 0.20         # -0.05
        age_window: 0.10           # -0.05: this season, not the next five
        draft_capital: 0.10        # -0.05: picks are currency for help now
      redraft:
        lineup: 0.70               # +0.10: ceiling over insurance, as above
        depth: 0.10                # -0.10
        market_value: 0.20         # unchanged
  rebuild:
    # For a league that ranks who is building best for the seasons ahead.
    # Weight moves from this season's lineup and title chances to what the
    # assets are worth and the picks still to come. Dynasty only: a redraft
    # roster carries nothing into next season to rebuild with.
    weights:
      dynasty:
        starting_lineup: 0.15      # -0.15: this season's form is evidence,
                                    # not the thing ranked
        dynasty_value: 0.35        # +0.10: what the roster is worth over the
                                    # long run
        depth: 0.10                # -0.05: an injury costs a rebuilding team
                                    # a week it was not playing for
        quarterback: 0.10          # unchanged
        future_draft_capital: 0.25 # +0.15: the picks are the rebuild
        roster_flexibility: 0.05   # unchanged
        # No contender_viability: a league ranking for the rebuild does not
        # reward winning this season over setting up the next. A team that
        # can win now still shows it in starting_lineup.
    strength:
      dynasty:
        lineup: 0.15               # -0.20: this season's form is evidence
        depth: 0.05                # -0.05
        market_value: 0.30         # +0.05: what the roster is worth
        age_window: 0.25           # +0.10: who is young where it counts
        draft_capital: 0.25        # +0.10: the picks are the rebuild

# The team strength rating: a number from 0 to 100 that the CODE computes for
# every team from facts (src/analysis/strength.mjs), so it can be reproduced and
# checked. The rankings above are still the model's judgement under `weights`;
# the rating is one piece of evidence it may cite, never the sole reason for a
# rank. docs/editorial-model.md has the formula.
#
# Each component is ranked across the league and turned into a 0-100 score by
# its rank, so the rating is relative to this league, not to football at large:
#
#   lineup         the best legal lineup each roster could have fielded, in
#                  points, averaged over the last `lineup_weeks` settled weeks
#   depth          the points the bench would have supplied in those weeks had
#                  the week's `short_week_starters` best starters been missing
#                  (an injury and a bye)
#   market_value   FantasyCalc's value of the players on the roster today
#   age_window     dynasty only: the starters' age against the league's average
#                  at each position, weighted by their points; younger is better
#   draft_capital  dynasty only, and only where traded picks are read (Sleeper):
#                  the priced value of the future picks the team holds
#
# A component the league cannot supply (no settled week in the preseason, no
# market, ESPN's traded picks) is left out and listed as unavailable, and the
# weights of the others are scaled back up to 1.0. It never counts as zero.
#
# These sets are the `balanced` preset; the other presets carry their own under
# presets.<name>.strength. Like the ranking weights they are editorial choices
# and each set adds up to 1.0. Guillotine leagues get no strength rating: their
# survival rankings already judge the floor, which is a different question.
strength:
  dynasty:
    lineup: 0.35         # what the roster can put on the field now
    depth: 0.10          # survives an injury or a bye
    market_value: 0.25   # what the assets are worth long term
    age_window: 0.15     # how long the production lasts
    draft_capital: 0.15  # the picks still to come
  redraft:
    # No age_window and no draft_capital: nothing carries into next season.
    lineup: 0.60
    depth: 0.20
    market_value: 0.20   # the market's view of the roster for this season

# What the strength rating reads.
strength_inputs:
  lineup_weeks: 4          # the last N settled weeks for lineup, depth and
                            # age_window: recent enough to be this roster,
                            # long enough that one week is not the rating
  short_week_starters: 2   # how many of a week's best starters a short week
                            # loses, for depth

weekly:
  # How far a team should normally move in one week. One Sunday is a very
  # small sample and the rankings should act like it.
  max_normal_movement: 3
  # ...but a genuinely extraordinary week is allowed to break that rule.
  allow_exceptional_movement: true

tiers:
  # Group teams into tiers as well as ranking them 1..N. Tier names are
  # written fresh each week by the publication; this only turns them on.
  enabled: true
